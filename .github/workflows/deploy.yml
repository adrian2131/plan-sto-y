name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uprawnienia potrzebne do publikacji na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Jeden aktywny deploy naraz; nie przerywaj trwających
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Próba automatycznego włączenia Pages (źródło: GitHub Actions).
          # Jeśli się nie powiedzie, włącz ręcznie w Settings → Pages.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
